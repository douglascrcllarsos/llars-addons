name: Llars Control
version: "0.5.2"
slug: gestor
image: "ghcr.io/douglascrcllarsos/llars-control-{arch}"
description: Aerotermia Samsung (NASA), motor de clima y gestión de la instalación
url: https://github.com/douglascrcllarsos/llars-control
arch: [aarch64, amd64]
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:heat-pump
panel_title: Llars Control
startup: services
boot: auto
uart: true
services: ["mqtt:need"]
homeassistant_api: true
hassio_api: true
# manager: sin este rol el Supervisor devuelve 403 al GET /addons que llena
# el desplegable de add-ons de las antenas Z2M (lección de banco, 08/09/2026)
hassio_role: manager
map:
  - addon_config:rw
options:
  modulo_aerotermia: false
  motor_clima: false
  modulo_watchdog: false
  alias: "EHS principal"
  conexion:
    tipo: tcp
    host: ""
    puerto: 8899
    dispositivo: ""
  sondeo_activo_s: 10
  acs_instalado: false
  controles_cliente:
    onoff: false
    modo: false
    consigna_agua: false
    silencioso: false
    consigna_min: -5.0
    consigna_max: 5.0
  escritura_habilitada: true
schema:
  modulo_aerotermia: bool
  motor_clima: bool
  modulo_watchdog: bool
  alias: str
  conexion:
    tipo: list(tcp|serie)
    host: str?
    puerto: port
    dispositivo: str?
  sondeo_activo_s: int(5,3600)
  acs_instalado: bool
  controles_cliente:
    onoff: bool
    modo: bool
    consigna_agua: bool
    silencioso: bool
    consigna_min: float
    consigna_max: float
  escritura_habilitada: bool
